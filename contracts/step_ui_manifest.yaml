        {
          "name": "filter",
          "widget_type": "json",
          "label": "Property equality filter (JSON)",
          "required": false,
          "help_text": "Optional flat object of property names and values to match by equality. Omit to read nodes with the selected label up to Maximum results.",
          "placeholder": "{\"category\":\"refunds\"}"
        },
        {
          "name": "limit",
          "widget_type": "integer",
          "label": "Maximum results",
          "required": false,
          "help_text": "Maximum records to return in this call, from 1 to 100. This is not an automatic all-pages read.",
          "placeholder": "20"
        }
      ]
    },
    {
      "operation_id": "delete_node",
      "title": "Graph: Delete a node",
      "fields": [
        {
          "name": "label",
          "widget_type": "textarea",
          "label": "Node label",
          "required": true,
          "help_text": "Existing or intended Neo4j node label, using letters, digits and underscores. Start with a letter or underscore; maximum 64 characters.",
