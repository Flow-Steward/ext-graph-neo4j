{
  "forms": [
    {
      "operation_id": "ensure_node_constraint",
      "title": "Graph: Create or check a unique node ID",
      "fields": [
        {
          "name": "label",
          "widget_type": "textarea",
          "label": "Node label",
          "required": true,
          "help_text": "Existing or intended Neo4j node label, using letters, digits and underscores. Start with a letter or underscore; maximum 64 characters.",
          "placeholder": "Article"
        }
      ]
    },
    {
      "operation_id": "upsert_node",
      "title": "Graph: Create or update a node",
      "fields": [
        {
          "name": "label",
          "widget_type": "textarea",
          "label": "Node label",
          "required": true,
          "help_text": "Existing or intended Neo4j node label, using letters, digits and underscores. Start with a letter or underscore; maximum 64 characters.",
          "placeholder": "Article"
        },
        {
          "name": "node_id",
          "widget_type": "textarea",
          "label": "Stable node ID",
          "required": true,
          "help_text": "String value stored in the connection’s configured id_property. This is a business ID, not Neo4j’s internal node ID.",
          "placeholder": "manual_42"
        },
        {
          "name": "properties",
          "widget_type": "json",
          "label": "Node or relationship properties (JSON)",
          "required": false,
          "help_text": "Flat object of scalar values or homogeneous scalar arrays. Nested objects are rejected; null removes a property. Do not include the configured stable ID property.",
          "placeholder": "{\"title\":\"Refund policy\",\"text\":\"Refunds are accepted within 30 days.\"}"
        }
      ]
    },
    {
      "operation_id": "get_node",
      "title": "Graph: Read a node by stable ID",
      "fields": [
        {
          "name": "label",
          "widget_type": "textarea",
          "label": "Node label",
          "required": true,
          "help_text": "Existing or intended Neo4j node label, using letters, digits and underscores. Start with a letter or underscore; maximum 64 characters.",
