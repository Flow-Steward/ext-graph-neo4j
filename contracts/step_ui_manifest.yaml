          "placeholder": "manual_42"
        },
        {
          "name": "detach",
          "widget_type": "boolean",
          "label": "Also delete attached relationships",
          "required": false,
          "help_text": "Default false. Enable to remove incident relationships when deleting the node; otherwise deletion fails if relationships still exist.",
          "placeholder": "false"
        }
      ]
    },
    {
