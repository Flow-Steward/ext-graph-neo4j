      "operation_id": "ensure_vector_index",
      "title": "Vector: Create or check a node index",
      "fields": [
        {
          "name": "index_name",
          "widget_type": "textarea",
          "label": "Node vector index name",
          "required": true,
          "help_text": "Name of the node vector index to create or inspect. Use letters, digits and underscores, starting with a letter or underscore; maximum 64 characters.",
          "placeholder": "article_vectors"
        },
        {
          "name": "label",
          "widget_type": "textarea",
          "label": "Node label",
          "required": true,
          "help_text": "Existing or intended Neo4j node label, using letters, digits and underscores. Start with a letter or underscore; maximum 64 characters.",
          "placeholder": "Article"
        },
        {
          "name": "embedding_property",
          "widget_type": "textarea",
          "label": "Embedding property name",
          "required": false,
          "help_text": "Node property containing the numeric embedding array. Defaults to embedding and must differ from the configured stable ID property.",
          "placeholder": "embedding"
        },
        {
          "name": "dimensions",
          "widget_type": "integer",
          "label": "Embedding dimensions",
          "required": true,
          "help_text": "Number of components returned by your embedding model, 1–4096. Existing index dimensions must match; 3 matches the illustrative array examples.",
          "placeholder": "3"
        },
        {
          "name": "similarity",
          "widget_type": "textarea",
          "label": "Similarity metric",
          "required": false,
          "help_text": "cosine (default) or euclidean. An existing index must use the selected metric.",
          "placeholder": "cosine"
        }
      ]
    },
