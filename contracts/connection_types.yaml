{
  "connection_types": [
    {
      "connection_type_id": "neo4j",
      "display_name": "Neo4j",
      "description": "Direct Bolt connection. TLS certificates and server hostname are verified. Project connection selects database and stable ID property.",
      "config_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "host"
        ],
        "properties": {
          "host": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253,
            "title": "Server hostname or IP"
          },
          "port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535,
            "default": 7687
          },
          "tls": {
            "type": "boolean",
            "default": true
          },
          "database": {
            "type": "string",
            "minLength": 1,
            "maxLength": 63,
            "default": "neo4j"
          },
          "id_property": {
            "type": "string",
            "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,63}$",
            "minLength": 1,
            "maxLength": 64,
            "default": "id"
          },
          "request_timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30,
            "default": 15
          }
        }
      },
      "secret_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "title": "Username"
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "title": "Password"
          }
        }
      },
      "capabilities": {
        "test_connection": false,
        "live_request": true,
        "workflow_trigger": false,
        "callback_ingress": false
      },
      "safety_profile": {
        "requires_https": false,
        "requires_host_allowlist": true,
        "stores_secret_values": false
      }
    }
  ]
}
