name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z)
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    uses: Flow-Steward/extensions/.github/workflows/release-extension.yml@937f5e6ae8d4118c18d65d88826b0521582c7f76
    with:
      build_native: true
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
