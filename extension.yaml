{
  "manifest_version": 2,
  "extension_id": "flowsteward.neo4j",
  "kind": "tool_provider",
  "version": "1.0.3",
  "release_stage": "active",
  "display_name": "Neo4j",
  "description": "Neo4j graph reads and writes, vector index lifecycle and nearest-neighbor search through a minimal Google MCP Toolbox build.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "neo4j",
      "graph",
      "vector",
      "toolbox"
    ],
    "summary": "Graph CRUD and native vector search."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "connection_fields": [
      "neo4j.host"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project Neo4j database connections."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "ensure_node_constraint",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_node",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_node",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_relationship",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_relationship",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "ensure_vector_index",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "drop_vector_index",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_vector_node",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_vector_node",
      "effect_kind": "database_write",
      "channel": "neo4j",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_neo4j",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
